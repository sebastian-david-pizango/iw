<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contáctame</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Mi Sitio Web Personal</h1>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="author.html">Autor</a></li>
                <li><a href="w3c.html">W3C</a></li>
                <li><a href="contactme.html" class="active">Contáctame</a></li>
            </ul>
        </nav>
    </header>
    
    <div class="container">
        <main class="content">
            <h2>Formulario de Contacto</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="nombres">Nombres:</label>
                    <input type="text" id="nombres" name="nombres" required>
                </div>
                
                <div class="form-group">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                
                <div class="form-group">
                    <label>Género:</label>
                    <input type="radio" id="masculino" name="genero" value="M">
                    <label for="masculino" style="display:inline;">Masculino</label>
                    <input type="radio" id="femenino" name="genero" value="F">
                    <label for="femenino" style="display:inline;">Femenino</label>
                </div>
                
                <div class="form-group">
                    <label for="nacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="nacimiento" name="nacimiento" required>
                </div>
                
                <div class="form-group">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" required>
                </div>
                
                <div class="form-group">
                    <label for="contenido">Contenido:</label>
                    <textarea id="contenido" name="contenido" rows="5" required></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Enviar Message</button>
            </form>
        </main>
    </div>
</body>
</html>
